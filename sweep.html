<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@300;400;700;900&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fdf8f0;
  --fg: #1a1a1a;
  --muted: #b8b0a8;
  --pink: #f06090;
  --yellow: #f5d020;
  --teal: #30c8b8;
}

body {
  background: var(--bg); color: var(--fg);
  font-family: 'Space Mono', monospace;
  overflow: hidden; height: 100vh; width: 100vw; cursor: none;
}

canvas { position: fixed; top: 0; left: 0; display: block; width: 100vw; height: 100vh; touch-action: none; }

#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 28px 36px; pointer-events: none; z-index: 50;
}

#title {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 900; letter-spacing: -0.03em;
  line-height: 1; color: var(--pink);
}

#hud-right { display: flex; gap: 40px; align-items: flex-start; }
.hud-stat { text-align: right; }
.hud-label { font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.hud-value {
  font-family: 'Unbounded', sans-serif;
  font-size: 20px; font-weight: 400; color: var(--fg); line-height: 1;
}
#timer.urgent { color: var(--pink); }

#sound-counters {
  position: fixed; bottom: 28px; left: 36px;
  pointer-events: none; z-index: 50;
  display: flex; flex-direction: column; gap: 10px;
}
.counter-row { display: flex; align-items: center; gap: 12px; }
.counter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.counter-dot.dirt { background: var(--teal); }
.counter-dot.obstacle { background: var(--pink); }
.counter-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); width: 80px; }
.counter-num { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 400; color: var(--fg); }

#event-log {
  position: fixed; bottom: 28px; right: 36px;
  pointer-events: none; z-index: 50;
  text-align: right; display: flex; flex-direction: column;
  align-items: flex-end; gap: 5px;
}
.log-entry { font-size: 9px; letter-spacing: 0.1em; color: var(--muted); animation: fadeIn 0.25s ease forwards; }
.log-entry.dirt-log { color: var(--teal); }
.log-entry.obstacle-log { color: var(--pink); }
@keyframes fadeIn { from { opacity: 0; transform: translateX(6px); } to { opacity: 1; transform: none; } }

#burst {
  position: fixed; pointer-events: none; z-index: 100;
  font-family: 'Unbounded', sans-serif; font-size: 11px;
  font-weight: 700; letter-spacing: 0.1em; opacity: 0;
}
#burst.pop { animation: burstAnim 0.9s ease-out forwards; }
@keyframes burstAnim {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  50%  { opacity: 0.85; transform: translateY(-22px) scale(1.08); }
  100% { opacity: 0; transform: translateY(-50px) scale(0.85); }
}

.screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: var(--bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 200;
}
.screen h1 {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(72px, 12vw, 140px); font-weight: 900;
  letter-spacing: -0.04em; line-height: 0.9;
  text-align: center; margin-bottom: 32px; color: var(--pink);
}
.screen-sub {
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 48px; text-align: center; line-height: 2.4;
}
.screen-btn {
  font-family: 'Space Mono', monospace; font-size: 11px;
  letter-spacing: 0.2em; text-transform: uppercase;
  background: var(--pink); color: #fff;
  border: none; padding: 16px 44px; cursor: pointer; transition: opacity 0.15s;
  border-radius: 2px;
}
.screen-btn:hover { opacity: 0.8; }

.end-stats { display: flex; gap: 56px; margin-bottom: 48px; }
.end-stat { text-align: center; }
.end-stat-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.end-stat-num { font-family: 'Unbounded', sans-serif; font-size: 40px; font-weight: 400; line-height: 1; color: var(--fg); }
.end-stat-num.dirt-num { color: var(--teal); }

/* ── Joystick (touch only) ── */
#joystick-wrap {
  display: none;
  position: fixed;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 300;
  pointer-events: none;
}
@media (pointer: coarse) {
  #joystick-wrap { display: block; pointer-events: none; }
}
#joystick-base {
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(26,26,26,0.08);
  border: 1.5px solid rgba(26,26,26,0.18);
  position: relative;
  touch-action: none;
  pointer-events: all;
  cursor: pointer;
}
#joystick-knob {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--pink);
  opacity: 0.85;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="burst"></div>

<div id="hud">
  <div id="title">SWEEP</div>
  <div id="hud-right">
    <div class="hud-stat">
      <div class="hud-label">Time</div>
      <div class="hud-value" id="timer">3:30</div>
    </div>
  </div>
</div>

<div id="sound-counters">
  <div class="counter-row">
    <div class="counter-dot dirt"></div>
    <div class="counter-label">Dirt</div>
    <div class="counter-num" id="cnt-dirt">0</div>
  </div>
  <div class="counter-row">
    <div class="counter-dot obstacle"></div>
    <div class="counter-label">Obstacle</div>
    <div class="counter-num" id="cnt-obs">0</div>
  </div>
</div>

<div id="event-log"></div>

<!-- Joystick (mobile/tablet only) -->
<div id="joystick-wrap">
  <div id="joystick-base">
    <div id="joystick-knob"></div>
  </div>
</div>

<div class="screen" id="start-screen">
  <h1>SWEEP</h1>
  <p class="screen-sub">Navigate a hidden interior.<br>What you hit reveals itself.<br>3 minutes 30 seconds.</p>
  <button class="screen-btn" onclick="startGame()">START</button>
  <p style="font-size:9px;letter-spacing:0.15em;color:#ccc;margin-top:20px;text-transform:uppercase;">WASD — Arrow Keys</p>
</div>

<div class="screen" id="end-screen" style="display:none;">
  <h1>DONE</h1>
  <div class="end-stats">
    <div class="end-stat"><div class="end-stat-label">Dirt sounds</div><div class="end-stat-num dirt-num" id="end-dirt">0</div></div>
    <div class="end-stat"><div class="end-stat-label">Obstacle sounds</div><div class="end-stat-num" id="end-obs">0</div></div>
    <div class="end-stat"><div class="end-stat-label">Total events</div><div class="end-stat-num" id="end-total">0</div></div>
  </div>
  <button class="screen-btn" onclick="restartGame()">PLAY AGAIN</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  SOUND FILE CONFIGURATION
//  Replace the filename strings with your own mp3s.
//  All files should be placed in the same folder as this html.
//
//  TWO CATEGORIES:
//
//  1. DIRT SOUNDS — played when the car picks up a dirt particle
//     You can define multiple files; they play in rotation.
//
//  2. OBSTACLE SOUNDS — one sound per obstacle type
//     Types: wall, sofa, bed, table, shelf, cabinet, chair, plant, lamp, desk
// ═══════════════════════════════════════════════════════════════

const SOUND_FILES = {

  // ── Dirt sounds (rotation) ──────────────────────────────────
  // Add as many as you like. They cycle in order.
  dirt: [
    'dirt_01.mp4',   // ← replace with your file name
    'dirt_02.mp4',   // ← replace or remove
    'dirt_03.mp4',   // ← replace or remove
  ],

  // ── Obstacle sounds (grouped by file) ───────────────────────
  obstacle: {
    wall:    'obstacle_wall.mp4',

    sofa:    'obstacle_sofa-bed.mp4',
    bed:     'obstacle_sofa-bed.mp4',

    table:   'obstacle_table-shelf-cab.mp4',
    shelf:   'obstacle_table-shelf-cab.mp4',
    cabinet: 'obstacle_table-shelf-cab.mp4',

    chair:   'obstacle_chair-plant-lamp-desk.mp4',
    plant:   'obstacle_chair-plant-lamp-desk.mp4',
    lamp:    'obstacle_chair-plant-lamp-desk.mp4',
    desk:    'obstacle_chair-plant-lamp-desk.mp4',
  }

};

// ═══════════════════════════════════════════════════════════════
//  END OF SOUND CONFIGURATION
// ═══════════════════════════════════════════════════════════════


// ── Audio player (uses <audio> elements — works with mp4 video+audio files) ──
const audioElements = { dirt: [], obstacle: {} };

function createAudio(filename) {
  const el = document.createElement('audio');
  el.src = filename;
  el.preload = 'auto';
  return el;
}

function loadAllSounds() {
  SOUND_FILES.dirt.forEach(f => {
    audioElements.dirt.push(createAudio(f));
  });
  const seen = {};
  Object.entries(SOUND_FILES.obstacle).forEach(([type, f]) => {
    if (!seen[f]) seen[f] = createAudio(f);
    audioElements.obstacle[type] = seen[f];
  });
}

function playAudio(el) {
  if (!el) return false;
  const clone = el.cloneNode();
  clone.volume = 1.0;
  clone.play().catch(()=>{});
  return true;
}

// ── Fallback synth (used when file missing) ───────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();

// ── Fallback synth (used when mp3 not loaded yet) ────────────
function tone(freq, type, dur, vol, slideFrom, delayMs) {
  vol = vol||0.28; delayMs = delayMs||0;
  const t = AC.currentTime + delayMs/1000;
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination); o.type = type;
  if (slideFrom) { o.frequency.setValueAtTime(slideFrom,t); o.frequency.exponentialRampToValueAtTime(freq,t+dur*0.25); }
  else o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseSound(dur, vol, filterFreq, delayMs) {
  vol=vol||0.18; filterFreq=filterFreq||1200; delayMs=delayMs||0;
  const t = AC.currentTime+delayMs/1000;
  const buf = AC.createBuffer(1,Math.ceil(AC.sampleRate*dur),AC.sampleRate);
  const d = buf.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(), filt=AC.createBiquadFilter(), g=AC.createGain();
  filt.type='bandpass'; filt.frequency.value=filterFreq; filt.Q.value=2;
  src.buffer=buf; src.connect(filt); filt.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.start(t); src.stop(t+dur+0.02);
}

const dirtMelodies = [
  [523,659,784,1047],[440,554,659,880],[392,494,587,784],[587,740,880,1175],[494,622,740,988]
];
let dirtIdx = 0;
function fallbackDirt() {
  const notes = dirtMelodies[dirtIdx%dirtMelodies.length]; dirtIdx++;
  notes.forEach((f,i) => { tone(f,'sine',0.5,0.2,0,i*55); tone(f*2,'sine',0.28,0.05,0,i*55); });
  noiseSound(0.04,0.07,2500);
}

const fallbackObstacle = {
  wall:    ()=>{ tone(55,'square',0.22,0.35); tone(45,'sawtooth',0.28,0.15); noiseSound(0.06,0.12,200); },
  sofa:    ()=>{ tone(196,'sine',0.85,0.28); tone(294,'sine',0.65,0.13,392); tone(392,'sine',0.4,0.06); },
  bed:     ()=>{ tone(110,'sine',0.9,0.32); tone(165,'sine',0.7,0.15,220); tone(220,'sine',0.4,0.06); },
  table:   ()=>{ tone(523,'triangle',0.5,0.3); tone(1047,'sine',0.22,0.09); noiseSound(0.03,0.05,3500); },
  shelf:   ()=>{ tone(392,'sawtooth',0.3,0.22); noiseSound(0.1,0.13,1800); tone(784,'sine',0.18,0.07); },
  cabinet: ()=>{ tone(261,'square',0.32,0.26); tone(131,'triangle',0.4,0.14); },
  chair:   ()=>{ tone(659,'triangle',0.24,0.25); tone(988,'sine',0.14,0.09); tone(1319,'sine',0.1,0.04); },
  plant:   ()=>{ tone(1047,'sine',1.0,0.18); tone(1319,'sine',0.8,0.09,800); tone(1568,'sine',0.5,0.04); },
  lamp:    ()=>{ tone(1568,'sine',0.35,0.22); tone(2093,'sine',0.2,0.08); tone(2637,'sine',0.12,0.03); },
  desk:    ()=>{ tone(440,'triangle',0.4,0.28); tone(880,'sine',0.2,0.09); noiseSound(0.05,0.06,2500); },
};

function triggerDirt() {
  if (AC.state==='suspended') AC.resume();
  const el = audioElements.dirt[dirtIdx % audioElements.dirt.length];
  if (!playAudio(el)) fallbackDirt();
  dirtIdx++;
}

function triggerObstacle(type) {
  if (AC.state==='suspended') AC.resume();
  const el = audioElements.obstacle[type];
  if (!playAudio(el)) (fallbackObstacle[type]||fallbackObstacle.wall)();
}

// ── Palette ───────────────────────────────────────────────────
const PAL = {
  wall:    { fill:'#dedad0', stroke:'#b8b4aa', label:'#888' },
  sofa:    { fill:'#b8d4f0', stroke:'#6898d0', label:'#2a5888' },
  bed:     { fill:'#a8c8e8', stroke:'#5888c8', label:'#185080' },
  table:   { fill:'#f0d070', stroke:'#c8a020', label:'#7a6000' },
  shelf:   { fill:'#f0b07a', stroke:'#d07030', label:'#803010' },
  cabinet: { fill:'#b8e0a8', stroke:'#6ab858', label:'#306018' },
  chair:   { fill:'#d8b8e8', stroke:'#a868c8', label:'#583878' },
  plant:   { fill:'#a0d8a8', stroke:'#50a860', label:'#206028' },
  lamp:    { fill:'#f0d898', stroke:'#d0a828', label:'#785800' },
  desk:    { fill:'#f0a890', stroke:'#d05848', label:'#802020' },
};

// Solid = car cannot pass through (wall, sofa, bed)
// Soft  = car bounces but can "push through" after multiple hits
const SOLID_TYPES = new Set(['wall','sofa','bed']);

// ── Canvas ────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize',()=>{ resize(); if(!gameRunning) drawIdle(); });

// ── Map ───────────────────────────────────────────────────────
const FTYPES = ['sofa','table','shelf','cabinet','chair','plant','lamp','desk','bed'];
let obstacles=[], dirts=[];

function generateMap() {
  obstacles=[]; dirts=[];
  const m=60, pw=W-m*2, ph=H-m*2;
  const cnt = 12+Math.floor(Math.random()*7);
  for (let i=0;i<cnt;i++) {
    const type=FTYPES[Math.floor(Math.random()*FTYPES.length)];
    const big=['sofa','bed','table','desk'].includes(type);
    const fw=big?72+Math.random()*80:32+Math.random()*50;
    const fh=big?38+Math.random()*50:22+Math.random()*34;
    const fx=m+Math.random()*(pw-fw);
    const fy=m+Math.random()*(ph-fh);
    if (Math.abs(fx+fw/2-W/2)<90&&Math.abs(fy+fh/2-H/2)<90){i--;continue;}
    obstacles.push({x:fx,y:fy,w:fw,h:fh,type,revealed:false,flashT:0,lastHit:0});
  }
  const wc=4+Math.floor(Math.random()*3);
  for (let i=0;i<wc;i++) {
    const horiz=Math.random()>0.5;
    const ww=horiz?80+Math.random()*140:8+Math.random()*6;
    const wh=horiz?8+Math.random()*6:80+Math.random()*120;
    obstacles.push({x:m+Math.random()*(pw-ww),y:m+80+Math.random()*(ph-wh-80),w:ww,h:wh,type:'wall',revealed:false,flashT:0,lastHit:0});
  }
  const dc=50+Math.floor(Math.random()*16);
  for (let i=0;i<dc;i++) {
    dirts.push({x:m+Math.random()*pw,y:m+Math.random()*ph,r:3.5+Math.random()*4,collected:false,alpha:0});
  }
}

// ── Car ───────────────────────────────────────────────────────
let car, keys={}, carTrail=[];
function initCar() { car={x:W/2,y:H/2,vx:0,vy:0,angle:0,size:11}; carTrail=[]; }

// ── State ─────────────────────────────────────────────────────
let gameRunning=false, timeLeft=210, cntDirt=0, cntObs=0;
let timerInterval, rafId;

// ── Draw ──────────────────────────────────────────────────────
function drawAll() {
  const now=Date.now();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fdf8f0'; ctx.fillRect(0,0,W,H);

  // trail
  if (carTrail.length>1) {
    ctx.save();
    ctx.strokeStyle='rgba(240,96,144,0.1)';
    ctx.lineWidth=car.size*2.4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(carTrail[0].x,carTrail[0].y);
    for(let i=1;i<carTrail.length;i++) ctx.lineTo(carTrail[i].x,carTrail[i].y);
    ctx.stroke(); ctx.restore();
  }

  // dirt — visible only near car
  dirts.forEach(d=>{
    if(d.collected) return;
    const dx=car.x-d.x, dy=car.y-d.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const target=dist<72?Math.max(0,(72-dist)/72)*0.9:0;
    d.alpha+=(target-d.alpha)*0.14;
    if(d.alpha<0.01) return;
    ctx.save(); ctx.globalAlpha=d.alpha;
    ctx.fillStyle='#30c8a8';
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // obstacles
  obstacles.forEach(o=>{
    if(!o.revealed) return;
    const p=PAL[o.type]||PAL.wall;
    const age=now-o.flashT;
    const flash=age<320?(1-age/320):0;
    ctx.save();
    if(flash>0){
      const ri=parseInt(p.fill.slice(1,3),16),gi=parseInt(p.fill.slice(3,5),16),bi=parseInt(p.fill.slice(5,7),16);
      ctx.fillStyle=`rgb(${Math.round(ri+(255-ri)*flash*0.5)},${Math.round(gi+(255-gi)*flash*0.5)},${Math.round(bi+(255-bi)*flash*0.5)})`;
    } else { ctx.fillStyle=p.fill; }
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.strokeStyle=p.stroke; ctx.lineWidth=1.5;
    ctx.strokeRect(o.x+0.75,o.y+0.75,o.w-1.5,o.h-1.5);

    // solid indicator: small lock mark on wall/sofa/bed
    if(SOLID_TYPES.has(o.type)&&o.type!=='wall'){
      ctx.fillStyle=p.label;
      ctx.font='7px "Space Mono",monospace';
      ctx.textBaseline='top'; ctx.textAlign='right';
      ctx.fillText('■',o.x+o.w-4,o.y+4);
    }

    if(o.type!=='wall'){
      ctx.fillStyle=p.label;
      ctx.font='8px "Space Mono",monospace';
      ctx.textBaseline='middle'; ctx.textAlign='center';
      ctx.fillText(o.type.toUpperCase(),o.x+o.w/2,o.y+o.h/2);
    }
    ctx.restore();
  });

  // car — simple shape, toy car colors
  ctx.save();
  ctx.translate(car.x, car.y); ctx.rotate(car.angle);
  ctx.shadowColor = 'rgba(0,0,0,0.12)'; ctx.shadowBlur = 8;
  const s = car.size;
  // body
  ctx.fillStyle = '#f06090';
  ctx.beginPath();
  ctx.moveTo(s, 0); ctx.lineTo(-s*0.7, -s*0.65); ctx.lineTo(-s*0.4, 0); ctx.lineTo(-s*0.7, s*0.65);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  // teal accent ring
  ctx.strokeStyle = '#30c8b8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, s*0.38, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawIdle() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fdf8f0'; ctx.fillRect(0,0,W,H);
}

// ── Collision resolution ──────────────────────────────────────
// For SOLID obstacles: fully resolve overlap and zero velocity into wall.
// For soft obstacles: bounce and partial push.
function resolveObstacle(o, solid) {
  const cr=car.size;
  const cx=car.x, cy=car.y;
  const ol=cx+cr-o.x, or2=o.x+o.w-(cx-cr);
  const ot=cy+cr-o.y, ob2=o.y+o.h-(cy-cr);
  const minH=Math.min(ol,or2), minV=Math.min(ot,ob2);

  if(solid){
    // full separation — don't let car pass through
    if(minH<minV){
      if(ol<or2){ car.x=o.x-cr; car.vx=Math.min(0,car.vx)*-0.3; }
      else      { car.x=o.x+o.w+cr; car.vx=Math.max(0,car.vx)*-0.3; }
    } else {
      if(ot<ob2){ car.y=o.y-cr; car.vy=Math.min(0,car.vy)*-0.3; }
      else      { car.y=o.y+o.h+cr; car.vy=Math.max(0,car.vy)*-0.3; }
    }
  } else {
    // soft bounce — partial push
    if(minH<minV){ car.vx*=-0.55; car.x+=ol<or2?-ol*0.9:or2*0.9; }
    else         { car.vy*=-0.55; car.y+=ot<ob2?-ot*0.9:ob2*0.9; }
  }
}

function checkCollisions() {
  const now=Date.now();
  const {x:cx,y:cy,size:cr}=car;

  // dirt pickup
  dirts.forEach(d=>{
    if(d.collected) return;
    const dx=cx-d.x,dy=cy-d.y;
    if(Math.sqrt(dx*dx+dy*dy)<cr+d.r+3){
      d.collected=true; cntDirt++;
      triggerDirt();
      updateCounters();
      addLog('dirt','dirt collected');
      showBurst('✦ DIRT','#20a888',cx,cy);
    }
  });

  // obstacle collision
  // sort: solid first so they resolve before soft
  const sorted=[...obstacles].sort((a,b)=>(SOLID_TYPES.has(b.type)?1:0)-(SOLID_TYPES.has(a.type)?1:0));

  sorted.forEach(o=>{
    if(car.x+cr>o.x&&car.x-cr<o.x+o.w&&car.y+cr>o.y&&car.y-cr<o.y+o.h){
      const solid=SOLID_TYPES.has(o.type);
      // solid obstacles fire every frame while touching; soft have cooldown
      if(!solid&&now-(o.lastHit||0)<380) return;
      o.lastHit=now;

      resolveObstacle(o, solid);

      if(!o.revealed) o.revealed=true;
      o.flashT=now; cntObs++;
      triggerObstacle(o.type);
      updateCounters();
      addLog('obstacle',o.type);
      const p=PAL[o.type]||PAL.wall;
      showBurst(o.type.toUpperCase(),p.stroke,cx,cy);
    }
  });

  // screen boundary (always solid)
  if(car.x-cr<0){ car.x=cr; car.vx=Math.abs(car.vx)*0.4; }
  if(car.x+cr>W){ car.x=W-cr; car.vx=-Math.abs(car.vx)*0.4; }
  if(car.y-cr<0){ car.y=cr; car.vy=Math.abs(car.vy)*0.4; }
  if(car.y+cr>H){ car.y=H-cr; car.vy=-Math.abs(car.vy)*0.4; }
}

function updateCounters() {
  document.getElementById('cnt-dirt').textContent=cntDirt;
  document.getElementById('cnt-obs').textContent=cntObs;
}

function addLog(cls,text) {
  const log=document.getElementById('event-log');
  const el=document.createElement('div');
  el.className='log-entry '+cls+'-log';
  el.textContent=text.toUpperCase();
  log.appendChild(el);
  while(log.children.length>6) log.removeChild(log.firstChild);
}

function showBurst(text,color,x,y) {
  const el=document.getElementById('burst');
  el.className='';
  el.style.left=Math.min(x+18,W-150)+'px';
  el.style.top=Math.max(y-16,70)+'px';
  el.style.color=color;
  el.textContent=text;
  void el.offsetWidth;
  el.className='pop';
}

// ── Joystick ──────────────────────────────────────────────────
const jBase = document.getElementById('joystick-base');
const jKnob = document.getElementById('joystick-knob');
const jRadius = 33; // max knob travel
let jx = 0, jy = 0; // -1 to 1

jBase.addEventListener('touchstart', e => { e.preventDefault(); handleJoy(e.touches[0]); }, { passive: false });
jBase.addEventListener('touchmove',  e => { e.preventDefault(); handleJoy(e.touches[0]); }, { passive: false });
jBase.addEventListener('touchend',   e => { e.preventDefault(); resetJoy(); }, { passive: false });
jBase.addEventListener('touchcancel',e => { e.preventDefault(); resetJoy(); }, { passive: false });

function handleJoy(touch) {
  const rect = jBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = touch.clientX - cx;
  let dy = touch.clientY - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > jRadius) { dx = dx/dist*jRadius; dy = dy/dist*jRadius; }
  jx = dx / jRadius;
  jy = dy / jRadius;
  jKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

function resetJoy() {
  jx = 0; jy = 0;
  jKnob.style.transform = 'translate(-50%, -50%)';
}

// ── Input ─────────────────────────────────────────────────────
window.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup',e=>{ keys[e.key]=false; });

function processInput() {
  let ax=0,ay=0;
  if(keys['ArrowLeft']||keys['a']||keys['A']) ax-=1;
  if(keys['ArrowRight']||keys['d']||keys['D']) ax+=1;
  if(keys['ArrowUp']||keys['w']||keys['W']) ay-=1;
  if(keys['ArrowDown']||keys['s']||keys['S']) ay+=1;
  // joystick input
  ax += jx; ay += jy;
  car.vx=(car.vx+ax*0.55)*0.84;
  car.vy=(car.vy+ay*0.55)*0.84;
  const maxV=4.5;
  const v=Math.sqrt(car.vx**2+car.vy**2);
  if(v>maxV){ car.vx=car.vx/v*maxV; car.vy=car.vy/v*maxV; }
  if(v>0.15) car.angle=Math.atan2(car.vy,car.vx);
  car.x+=car.vx; car.y+=car.vy;
  carTrail.push({x:car.x,y:car.y});
  if(carTrail.length>90) carTrail.shift();
}

// ── Timer ─────────────────────────────────────────────────────
function updateTimer() {
  timeLeft--;
  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  const el=document.getElementById('timer');
  el.textContent=m+':'+String(s).padStart(2,'0');
  if(timeLeft<=30) el.classList.add('urgent');
  if(timeLeft<=0) endGame();
}

// ── Loop ──────────────────────────────────────────────────────
function loop() {
  if(!gameRunning) return;
  processInput(); checkCollisions(); drawAll();
  rafId=requestAnimationFrame(loop);
}

// ── Game Flow ─────────────────────────────────────────────────
function startGame() {
  document.getElementById('start-screen').style.display='none';
  document.getElementById('end-screen').style.display='none';
  document.getElementById('joystick-wrap').style.display='block';
  if(AC.state==='suspended') AC.resume();
  generateMap(); initCar();
  timeLeft=210; cntDirt=0; cntObs=0; dirtIdx=0;
  document.getElementById('timer').classList.remove('urgent');
  document.getElementById('timer').textContent='3:30';
  updateCounters();
  document.getElementById('event-log').innerHTML='';
  gameRunning=true;
  timerInterval=setInterval(updateTimer,1000);
  loop();
}

function endGame() {
  gameRunning=false;
  clearInterval(timerInterval);
  cancelAnimationFrame(rafId);
  resetJoy();
  document.getElementById('joystick-wrap').style.display='none';
  document.getElementById('end-dirt').textContent=cntDirt;
  document.getElementById('end-obs').textContent=cntObs;
  document.getElementById('end-total').textContent=cntDirt+cntObs;
  document.getElementById('end-screen').style.display='flex';
}

function restartGame() {
  document.getElementById('end-screen').style.display='none';
  startGame();
}

// preload sounds then draw idle
loadAllSounds();
drawIdle();
</script>
